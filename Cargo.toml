[workspace]
members = [
    "crates/quad-core",
    "crates/quad-sim",
    "crates/wasm-interface",
    "crates/bevy-ui",
]
default-members = ["crates/bevy-ui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quad-core = { path = "crates/quad-core" }
quad-sim = { path = "crates/quad-sim" }
bevy = { version = "0.19", default-features = false, features = [
    "default_app", "std", "3d_bevy_render", "ui", "bevy_winit",
    "bevy_gizmos", "keyboard", "mouse", "webgl2", "x11",
] }
bevy_rapier3d = { version = "0.35", features = ["debug-render-3d"] }
wasm-bindgen = "0.2"
